name: Sincronizar defensivos do SGI

on:
  schedule:
    # Brasília não tem horário de verão (UTC-3 fixo): 12h e 19h BRT = 15h e 22h UTC.
    - cron: "0 15 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      loja:
        description: "Só uma loja (vazio = todas as configuradas)"
        required: false
        type: choice
        options: ["", "Porteira", "Casa de Adubo"]
      data:
        description: "Só este dia, DD/MM/AAAA (vazio = dias pendentes + janela móvel)"
        required: false
        type: string
      forcar_tudo:
        description: "Rebuscar TODOS os dias desde a data inicial"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Só baixar e validar, sem gravar no banco"
        required: false
        type: boolean
        default: false

# Nunca duas sincronizações ao mesmo tempo (cron + botão do painel): a segunda espera.
concurrency:
  group: sync-sgi-defensivos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-sync.txt

      - name: Instalar dependências
        run: |
          pip install -r requirements-sync.txt
          playwright install --with-deps chromium

      - name: Rodar sincronização
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SGI_URL_LOGIN: ${{ secrets.SGI_URL_LOGIN }}
          SGI_LOGIN: ${{ secrets.SGI_LOGIN }}
          SGI_SENHA: ${{ secrets.SGI_SENHA }}
          SGI_EMPRESA_PORTEIRA: ${{ secrets.SGI_EMPRESA_PORTEIRA }}
          SGI_EMPRESA_CASA_ADUBO: ${{ secrets.SGI_EMPRESA_CASA_ADUBO }}
          SGI_OPERACOES: ${{ vars.SGI_OPERACOES || 'V' }}
          # inputs passam por variável de ambiente (nunca interpolados no shell -> sem injeção)
          IN_LOJA: ${{ github.event.inputs.loja }}
          IN_DATA: ${{ github.event.inputs.data }}
          IN_FORCAR: ${{ github.event.inputs.forcar_tudo }}
          IN_DRY: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=()
          if [ -n "$IN_LOJA" ]; then ARGS+=(--loja "$IN_LOJA"); fi
          if [ -n "$IN_DATA" ]; then
            [[ "$IN_DATA" =~ ^[0-9]{2}/[0-9]{2}/[0-9]{4}$ ]] || { echo "data inválida: use DD/MM/AAAA"; exit 2; }
            ARGS+=(--data "$IN_DATA")
          fi
          if [ "$IN_FORCAR" = "true" ]; then ARGS+=(--forcar-tudo); fi
          if [ "$IN_DRY" = "true" ]; then ARGS+=(--dry-run); fi
          python scripts/sync_sgi.py "${ARGS[@]}"

      - name: Guardar screenshots/HTML/PDF de depuração
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-sync-sgi-${{ github.run_id }}
          path: |
            debug_*.png
            debug_*.html
            debug_*.pdf
          if-no-files-found: ignore
          retention-days: 7   # contêm dados de venda: mantenha o repositório PRIVADO
