# Tema visual do painel. Referência: https://docs.streamlit.io/develop/api-reference/configuration/config.toml
[theme]
base = "light"
primaryColor = "#1B4B66"             # azul petróleo — botões, seleção, destaque
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8" # cinza claro neutro — inputs, cards
textColor = "#1A1F24"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#102A3E"          # navy escuro — menu lateral
secondaryBackgroundColor = "#193C54"
textColor = "#F2F5F7"

[client]
toolbarMode = "minimal"
